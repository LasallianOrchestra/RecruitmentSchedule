<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LSO Admin Diagnostics</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f8f5;color:#163426;margin:0;padding:24px}.card{max-width:760px;margin:auto;background:#fff;border:1px solid #d8e6de;border-radius:18px;padding:24px;box-shadow:0 18px 50px rgba(0,50,30,.08)}h1{margin:0 0 8px;color:#063d25}.muted{color:#63756b}.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #edf3ef}.ok{color:#087442;font-weight:800}.bad{color:#b42318;font-weight:800}button{margin-top:18px;border:0;border-radius:12px;background:#087442;color:#fff;padding:12px 16px;font-weight:800;cursor:pointer}pre{white-space:pre-wrap;background:#f5f8f6;padding:12px;border-radius:10px;font-size:12px}</style>
</head><body><div class="card"><h1>LSO Admin Diagnostics · v17</h1><p class="muted">This page does not alter bookings or admin records.</p><div id="checks"></div><button id="networkBtn">Test Supabase connection</button><pre id="result">Not tested yet.</pre></div>
<script src="./supabase-config.js?v=20260816-2303-v17"></script>
<script src="./lso-native-supabase-v17.js?v=20260816-2303-v17"></script>
<script>
(function(){
 const checks=document.getElementById('checks');
 const add=(name,ok,detail='')=>{const d=document.createElement('div');d.className='row';d.innerHTML='<span>'+name+(detail?' <small>('+detail+')</small>':'')+'</span><span class="'+(ok?'ok':'bad')+'">'+(ok?'PASS':'FAIL')+'</span>';checks.appendChild(d)};
 const c=window.LSO_SUPABASE_CONFIG;
 add('supabase-config.js loaded',!!c);
 add('Supabase Project URL present',!!c?.url,c?.url||'missing');
 add('Publishable key present',!!c?.publishableKey,c?.publishableKey?'sb_publishable_…':'missing');
 add('Local connection module loaded',!!window.LSO_NATIVE_SUPABASE?.createClient);
 let client=null;try{client=window.LSO_NATIVE_SUPABASE?.createClient(c?.url,c?.publishableKey,{storageKey:'lso_admin_session_v16'});}catch(e){}
 add('Auth client can initialize',!!client?.auth);
 document.getElementById('networkBtn').onclick=async()=>{
  const out=document.getElementById('result');out.textContent='Testing…';
  try{
   const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),8000);
   const r=await fetch(String(c.url).replace(/\/+$/,'')+'/auth/v1/settings',{headers:{apikey:c.publishableKey},signal:ctl.signal});clearTimeout(timer);
   const text=await r.text();out.textContent='HTTP '+r.status+'\n'+text.slice(0,1200);
  }catch(e){out.textContent='FAILED: '+(e?.message||e)+'\nIf this fails on GitHub Pages, the browser cannot reach the Supabase project from that device/network.'}
 };
})();
</script></body></html>
